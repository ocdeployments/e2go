<html lang="en">

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0a;

    font-size: 13px;
    line-height: 1.5;
    min-height: 100vh;
  }

  /* ── Top bar ── */
  .topbar {
    padding: 24px 28px 18px;
    border-bottom: 1px solid rgba(201,168,76,0.15);
    display: flex;
    align-items: baseline;
    gap: 20px;
    flex-wrap: wrap;
  }
  .topbar h1 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 300;
    font-size: 26px;
    color: #f5f0e8;
    letter-spacing: 0.01em;
  }
  .subtitle {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(201,168,76,0.55);
    font-weight: 500;
    margin-bottom: 4px;
  }
  .legend {
    margin-left: auto;
    display: flex;
    gap: 14px;
    align-items: center;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    color: rgba(245,240,232,0.45);
    letter-spacing: 0.04em;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .dot-built { background: #C9A84C; }
  .dot-partial { background: #d97706; }
  .dot-planned { background: rgba(245,240,232,0.2); border: 1px solid rgba(245,240,232,0.3); border-radius: 50%; }
  .dot-silo { background: #7c3aed; }

  /* ── Tab nav ── */
  .tabs {
    display: flex;
    border-bottom: 1px solid rgba(201,168,76,0.12);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tab {
    padding: 11px 20px;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: rgba(245,240,232,0.35);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    transition: color 0.15s, border-color 0.15s;
    user-select: none;
  }
  .tab:hover { color: rgba(201,168,76,0.7); }
  .tab.active { color: #C9A84C; border-bottom-color: #C9A84C; }

  /* ── Content pane ── */
  .pane { display: none; }
  .pane.active { display: block; }

  /* ── Phase rows ── */
  .phase { border-bottom: 1px solid rgba(201,168,76,0.1); }
  .phase-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 15px 28px;
    cursor: pointer;
    user-select: none;
  }
  .phase-header:hover { background: rgba(201,168,76,0.03); }
  .phase-number {
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(201,168,76,0.45);
    font-weight: 500;
    width: 60px;
    flex-shrink: 0;
  }
  .phase-name {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 300;
    font-size: 19px;
    color: #f5f0e8;
    flex: 1;
  }
  .phase-meta {
    font-size: 11px;
    color: rgba(245,240,232,0.35);
    flex: 2;
  }
  .phase-count { font-size: 10px; color: rgba(201,168,76,0.5); margin-right: 8px; }
  .chevron { font-size: 10px; color: rgba(201,168,76,0.4); transition: transform 0.2s; }
  .phase.open .chevron { transform: rotate(90deg); }
  .phase-body { display: none; padding: 0 28px 16px; }
  .phase.open .phase-body { display: block; }

  /* Feature rows */
  .feature {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 9px 0;
    border-bottom: 1px solid rgba(201,168,76,0.06);
  }
  .feature:last-child { border-bottom: none; }
  .feature-status { width: 7px; height: 7px; border-radius: 50%; margin-top: 4px; flex-shrink: 0; }
  .feature-name { font-size: 12px; font-weight: 500; color: #f5f0e8; flex: 1; min-width: 160px; }
  .feature-route { font-size: 10px; color: rgba(201,168,76,0.5); font-family: 'SF Mono', 'Consolas', monospace; flex: 1; }
  .feature-desc { font-size: 11px; color: rgba(245,240,232,0.4); flex: 2; }
  .badge { font-size: 9px; padding: 2px 7px; letter-spacing: 0.05em; text-transform: uppercase; font-weight: 600; flex-shrink: 0; }
  .badge-silo { background: rgba(124,58,237,0.15); color: #a78bfa; border: 1px solid rgba(124,58,237,0.3); }
  .badge-gap { background: rgba(220,38,38,0.1); color: #f87171; border: 1px solid rgba(220,38,38,0.25); }
  .badge-blocked { background: rgba(217,119,6,0.1); color: #fbbf24; border: 1px solid rgba(217,119,6,0.25); }
  .badge-new { background: rgba(201,168,76,0.1); color: #C9A84C; border: 1px solid rgba(201,168,76,0.25); }

  /* ── Data Flows ── */
  .flow-grid { padding: 20px 28px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .flow-card { border: 1px solid rgba(201,168,76,0.12); padding: 16px; background: rgba(201,168,76,0.02); }
  .flow-title { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #C9A84C; margin-bottom: 10px; }
  .flow-step { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 6px; font-size: 11px; color: rgba(245,240,232,0.6); }
  .flow-arrow { color: rgba(201,168,76,0.5); flex-shrink: 0; }

  /* ── Silos ── */
  .silo-grid { padding: 20px 28px; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  .silo-card { border: 1px solid rgba(124,58,237,0.25); padding: 16px; background: rgba(124,58,237,0.04); }
  .silo-card.resolved { border-color: rgba(201,168,76,0.2); background: rgba(201,168,76,0.02); }
  .silo-title { font-size: 12px; font-weight: 600; color: #a78bfa; margin-bottom: 7px; }
  .silo-card.resolved .silo-title { color: rgba(201,168,76,0.6); }
  .silo-desc { font-size: 11px; color: rgba(245,240,232,0.5); line-height: 1.6; }
  .silo-fix { margin-top: 9px; font-size: 10px; color: rgba(201,168,76,0.6); border-top: 1px solid rgba(124,58,237,0.15); padding-top: 8px; }
  .silo-card.resolved .silo-fix { color: #4ade80; border-top-color: rgba(74,222,128,0.15); }

  /* ── Gaps ── */
  .gap-section { padding: 20px 28px; }
  .gap-section-title { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(245,240,232,0.3); margin-bottom: 12px; margin-top: 24px; }
  .gap-section-title:first-child { margin-top: 0; }
  .gap-item { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(201,168,76,0.06); }
  .gap-priority { font-size: 9px; padding: 2px 6px; font-weight: 700; letter-spacing: 0.05em; flex-shrink: 0; margin-top: 1px; }
  .p-critical { background: rgba(220,38,38,0.12); color: #f87171; border: 1px solid rgba(220,38,38,0.3); }
  .p-high { background: rgba(217,119,6,0.1); color: #fbbf24; border: 1px solid rgba(217,119,6,0.3); }
  .p-medium { background: rgba(245,240,232,0.06); color: rgba(245,240,232,0.5); border: 1px solid rgba(245,240,232,0.15); }
  .gap-name { font-size: 12px; font-weight: 500; color: #f5f0e8; }
  .gap-desc { font-size: 11px; color: rgba(245,240,232,0.4); margin-top: 2px; }

  /* ── Engines ── */
  .engine-grid { padding: 20px 28px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .engine-card { border: 1px solid rgba(201,168,76,0.12); padding: 14px; background: rgba(201,168,76,0.02); }
  .engine-name { font-size: 11px; font-weight: 600; color: #C9A84C; margin-bottom: 4px; font-family: 'SF Mono', 'Consolas', monospace; }
  .engine-desc { font-size: 11px; color: rgba(245,240,232,0.5); margin-bottom: 8px; }
  .engine-consumers { font-size: 10px; color: rgba(245,240,232,0.3); border-top: 1px solid rgba(201,168,76,0.08); padding-top: 7px; }
  .engine-consumers span { color: rgba(201,168,76,0.5); }

  /* ── Database ── */
  .db-grid { padding: 20px 28px; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
  .db-table { border: 1px solid rgba(201,168,76,0.1); padding: 11px 13px; background: rgba(201,168,76,0.02); }
  .db-name { font-size: 10px; font-family: 'SF Mono', 'Consolas', monospace; color: #C9A84C; margin-bottom: 3px; }
  .db-desc { font-size: 10px; color: rgba(245,240,232,0.4); }
  .db-notes { font-size: 9px; color: rgba(245,240,232,0.22); margin-top: 4px; }
</style>

// ─── RENDER ──────────────────────────────────────────────────────────────────

function statusDot(s){return{built:'dot-built',partial:'dot-partial',silo:'dot-silo',planned:'dot-planned'}[s]||'dot-planned';}
function badgeHTML(b){if(!b)return'';const cls={silo:'badge-silo',gap:'badge-gap',blocked:'badge-blocked',new:'badge-new'}[b]||'';return`<span class="badge ${cls}">${b}</span>`;}

const phasesEl=document.getElementById('phases-container');
PHASES.forEach(phase=>{
  const built=phase.features.filter(f=>f.status==='built').length;
  const el=document.createElement('div');
  el.className='phase';
  el.innerHTML=`
    <div class="phase-header" onclick="togglePhase('${phase.id}')">
      <span class="phase-number">${phase.number}</span>
      <span class="phase-name">${phase.name}</span>
      <span class="phase-meta">${phase.meta}</span>
      <span class="phase-count">${built}/${phase.features.length} built</span>
      <span class="chevron">▶</span>
    </div>
    <div class="phase-body">
      ${phase.features.map(f=>`
        <div class="feature">
          <div class="feature-status dot ${statusDot(f.status)}"></div>
          <div class="feature-name">${f.name}</div>
          <div class="feature-route">${f.route}</div>
          <div class="feature-desc">${f.desc}</div>
          ${badgeHTML(f.badge)}
        </div>
      `).join('')}
    </div>
  `;
  phasesEl.appendChild(el);
});

const flowsEl=document.getElementById('flows-container');
FLOWS.forEach(flow=>{
  const el=document.createElement('div');
  el.className='flow-card';
  el.innerHTML=`<div class="flow-title">${flow.title}</div>${flow.steps.map((s,i)=>`<div class="flow-step"><span class="flow-arrow">${i===0?'▸':'↓'}</span><span>${s}</span></div>`).join('')}`;
  flowsEl.appendChild(el);
});

const silosEl=document.getElementById('silos-container');
SILOS.forEach(silo=>{
  const el=document.createElement('div');
  el.className='silo-card' + (silo.resolved ? ' resolved' : '');
  el.innerHTML=`<div class="silo-title">${silo.title}</div><div class="silo-desc">${silo.desc}</div><div class="silo-fix">→ ${silo.fix}</div>`;
  silosEl.appendChild(el);
});

const gapsEl=document.getElementById('gaps-container');
GAPS.forEach(group=>{
  const titleEl=document.createElement('div');
  titleEl.className='gap-section-title';
  titleEl.textContent=group.group;
  gapsEl.appendChild(titleEl);
  group.items.forEach(item=>{
    const el=document.createElement('div');
    el.className='gap-item';
    el.innerHTML=`<span class="gap-priority p-${item.priority}">${item.priority}</span><div><div class="gap-name">${item.name}</div><div class="gap-desc">${item.desc}</div></div>`;
    gapsEl.appendChild(el);
  });
});

const enginesEl=document.getElementById('engines-container');
ENGINES.forEach(eng=>{
  const el=document.createElement('div');
  el.className='engine-card';
  el.innerHTML=`<div class="engine-name">${eng.name}</div><div class="engine-desc">${eng.desc}</div><div class="engine-consumers">Consumed by: <span>${eng.consumers}</span></div>`;
  enginesEl.appendChild(el);
});

const dbEl=document.getElementById('db-container');
DB_TABLES.forEach(tbl=>{
  const el=document.createElement('div');
  el.className='db-table';
  el.innerHTML=`<div class="db-name">${tbl.name}</div><div class="db-desc">${tbl.desc}</div><div class="db-notes">${tbl.notes}</div>`;
  dbEl.appendChild(el);
});

function switchTab(name,tab){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.pane').forEach(p=>p.classList.remove('active'));
  tab.classList.add('active');
  document.getElementById('pane-'+name).classList.add('active');
}

function togglePhase(id){
  const el=document.querySelector(`#phases-container .phase:has([onclick*="${id}"])`);
  if(el) el.classList.toggle('open');
}

// Open all phases by default
document.querySelectorAll('#phases-container .phase').forEach(el=>el.classList.add('open'));
</script>
